[package]
name = "WallpaperHelper_rs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
tokio = { version = "1", features = ["time", "sync", "rt"] }
rfd = "0.17"
percent-encoding = "2"
notify-rust = "4"
interprocess = "2"
chrono = "0.4.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
log = { version = "0.4", features = ["std"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser", "windef", "errhandlingapi", "combaseapi",
    "objbase", "wtypes", "oleauto", "winerror", "guiddef",
    "wingdi", "winreg", "winnt", "minwindef", "unknwnbase", "shobjidl_core"
] }
windows = { version = "0.61.3", features = ["Win32_System_Com", "Win32_UI", "Win32_UI_Shell", "Win32_Graphics", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
# Same glib that tao's gtk3 event loop uses: background timers run on it so
# they keep firing while the window is hidden (see src/ui/background.rs).
glib = "0.18"
